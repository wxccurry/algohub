# AlgoHub 生产环境部署
# docker compose -f docker-compose.prod.yml up -d
version: "3.9"

services:
  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # ===== 前端 =====
  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
    restart: unless-stopped

  # ===== 后端 =====
  backend:
    build: ./backend
    environment:
      - ALGOHUB_DATABASE_URL=postgresql+asyncpg://algohub:${DB_PASSWORD:-algohub_prod}@db:5432/algohub
      - ALGOHUB_DATABASE_URL_SYNC=postgresql+psycopg2://algohub:${DB_PASSWORD:-algohub_prod}@db:5432/algohub
      - ALGOHUB_REDIS_URL=redis://redis:6379/0
      - ALGOHUB_JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-use-openssl-rand-hex-64}
      - ALGOHUB_JUDGE_CALLBACK_URL=http://backend:8000/api/judge/callback
      - ALGOHUB_JUDGE_CALLBACK_SECRET=${JUDGE_SECRET:-change-me-judge-secret}
      - ALGOHUB_CORS_ORIGINS=["https://${DOMAIN:-localhost}"]
      - ALGOHUB_DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ALGOHUB_AI_ENABLED=${AI_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ===== Celery Worker =====
  celery_worker:
    build: ./backend
    command: celery -A celery_app worker -l info -c 2
    environment:
      - ALGOHUB_DATABASE_URL=postgresql+asyncpg://algohub:${DB_PASSWORD:-algohub_prod}@db:5432/algohub
      - ALGOHUB_DATABASE_URL_SYNC=postgresql+psycopg2://algohub:${DB_PASSWORD:-algohub_prod}@db:5432/algohub
      - ALGOHUB_REDIS_URL=redis://redis:6379/0
      - ALGOHUB_JUDGE_CALLBACK_URL=http://backend:8000/api/judge/callback
      - ALGOHUB_JUDGE_CALLBACK_SECRET=${JUDGE_SECRET:-change-me-judge-secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ===== PostgreSQL =====
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: algohub
      POSTGRES_USER: algohub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-algohub_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algohub -d algohub"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== Certbot (按需启用 HTTPS) =====
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; done'"
    restart: unless-stopped

volumes:
  pgdata:
  certbot_www:
  certbot_conf:
